<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="620" height="300" fill="#ffffff"/>
<text x="310.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Order Lifecycle</text>
<text x="310.0" y="57" text-anchor="middle" font-size="11" fill="#666">Cancellation is represented by flags while an order may still execute</text>
