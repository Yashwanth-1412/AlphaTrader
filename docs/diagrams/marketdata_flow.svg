<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"
font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="1500" height="900" fill="#ffffff"/>
<defs>
 <marker id="blue2" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L11 4.5L0 9Z" fill="#1769aa"/></marker>
 <marker id="purple2" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L11 4.5L0 9Z" fill="#7650b5"/></marker>
</defs>

<text x="750" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#111">AlphaTrader — Market Data &amp; Recovery</text>
<text x="750" y="62" text-anchor="middle" font-size="12" fill="#555">One clean left-to-right live path; recovery is a separate lower path</text>

<!-- LIVE -->
<rect x="40" y="90" width="1420" height="300" rx="16" fill="#f7f9fc" stroke="#8aa3c0" stroke-width="2"/>
<text x="65" y="118" font-size="14" font-weight="700" fill="#274a86">LIVE INCREMENTAL FEED</text>

<rect x="70" y="155" width="285" height="185" rx="12" fill="#f2f4f6" stroke="#7d8792" stroke-width="2"/>
<text x="212" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#3f4852">NANOEXCHANGE</text>
<text x="212" y="208" text-anchor="middle" font-size="12" font-weight="700">UDP incremental feed</text>
<text x="212" y="229" text-anchor="middle" font-size="10.5" fill="#555">NEXSUB registration</text>
<text x="212" y="247" text-anchor="middle" font-size="10.5" fill="#555">[8B big-endian seq][ITCH]</text>
<text x="212" y="265" text-anchor="middle" font-size="10.5" fill="#555">one datagram per update</text>
<text x="212" y="292" text-anchor="middle" font-size="10.5" fill="#555">gateway evicts silent subscribers</text>
<text x="212" y="310" text-anchor="middle" font-size="10.5" fill="#555">client re-registers every 1 s</text>

<rect x="455" y="155" width="360" height="185" rx="12" fill="#eaf1fb" stroke="#4775b8" stroke-width="2"/>
<text x="635" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#274a86">MARKET DATA CONSUMER</text>
<text x="635" y="208" text-anchor="middle" font-size="12" font-weight="700">decode loop</text>
<text x="635" y="229" text-anchor="middle" font-size="10.5" fill="#444">truncated → wait</text>
<text x="635" y="247" text-anchor="middle" font-size="10.5" fill="#444">malformed byte → resync one byte</text>
<text x="635" y="265" text-anchor="middle" font-size="10.5" fill="#444">echoed NEXSUB → skip whole token</text>
<text x="635" y="292" text-anchor="middle" font-size="10.5" fill="#444">re-register every second</text>
<text x="635" y="310" text-anchor="middle" font-size="10.5" fill="#444">single feed thread · pinned core</text>

<rect x="915" y="155" width="260" height="185" rx="12" fill="#fff" stroke="#4775b8" stroke-width="2"/>
<text x="1045" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#274a86">SEQUENCE CHECK</text>
<text x="1045" y="210" text-anchor="middle" font-size="11.5" font-weight="700">contiguous?</text>
<text x="1045" y="235" text-anchor="middle" font-size="10.5" fill="#444">yes → decoded update</text>
<text x="1045" y="255" text-anchor="middle" font-size="10.5" fill="#444">no → gap detected</text>
<text x="1045" y="286" text-anchor="middle" font-size="10.5" fill="#555">gap size chooses replay</text>
<text x="1045" y="304" text-anchor="middle" font-size="10.5" fill="#555">or snapshot</text>

<rect x="1275" y="155" width="155" height="185" rx="12" fill="#eaf1fb" stroke="#4775b8" stroke-width="2"/>
<text x="1352" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#274a86">md_queue</text>
<text x="1352" y="212" text-anchor="middle" font-size="10.5" fill="#444">SPSC</text>
<text x="1352" y="232" text-anchor="middle" font-size="10.5" fill="#444">decoded updates</text>
<text x="1352" y="252" text-anchor="middle" font-size="10.5" fill="#444">engine hand-off</text>

<line x1="355" y1="247" x2="447" y2="247" stroke="#1769aa" stroke-width="3" marker-end="url(#blue2)"/>
<line x1="815" y1="247" x2="907" y2="247" stroke="#1769aa" stroke-width="3" marker-end="url(#blue2)"/>
<line x1="1175" y1="247" x2="1267" y2="247" stroke="#1769aa" stroke-width="3" marker-end="url(#blue2)"/>
<text x="401" y="235" text-anchor="middle" font-size="10" fill="#1769aa">UDP</text>
<text x="861" y="235" text-anchor="middle" font-size="10" fill="#1769aa">decoded</text>
<text x="1221" y="235" text-anchor="middle" font-size="10" fill="#1769aa">contiguous</text>

<!-- RECOVERY -->
<rect x="40" y="425" width="1420" height="390" rx="16" fill="#f4effb" stroke="#c7b3df" stroke-width="2"/>
<text x="65" y="453" font-size="14" font-weight="700" fill="#5b3591">RECOVERY STATE MACHINE</text>

<rect x="70" y="490" width="260" height="250" rx="12" fill="#fff" stroke="#7650b5" stroke-width="2"/>
<text x="200" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#5b3591">1 · GAP / BOOT</text>
<rect x="90" y="545" width="220" height="65" rx="8" fill="#f8f4fc" stroke="#b99bd5"/>
<text x="200" y="570" text-anchor="middle" font-size="11.5" font-weight="700">Boot</text>
<text x="200" y="589" text-anchor="middle" font-size="10" fill="#555">always S → snapshot</text>
<rect x="90" y="625" width="220" height="65" rx="8" fill="#f8f4fc" stroke="#b99bd5"/>
<text x="200" y="650" text-anchor="middle" font-size="11.5" font-weight="700">Gap</text>
<text x="200" y="669" text-anchor="middle" font-size="10" fill="#555">≤8192 R · &gt;8192 S</text>

<rect x="375" y="490" width="300" height="250" rx="12" fill="#fff" stroke="#7650b5" stroke-width="2"/>
<text x="525" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#5b3591">2 · REQUEST</text>
<rect x="395" y="545" width="260" height="65" rx="8" fill="#f8f4fc" stroke="#b99bd5"/>
<text x="525" y="570" text-anchor="middle" font-size="11.5" font-weight="700">Replay</text>
<text x="525" y="589" text-anchor="middle" font-size="10" fill="#555">'R' + 8B BE resume seq</text>
<rect x="395" y="625" width="260" height="65" rx="8" fill="#f8f4fc" stroke="#b99bd5"/>
<text x="525" y="650" text-anchor="middle" font-size="11.5" font-weight="700">Snapshot</text>
<text x="525" y="669" text-anchor="middle" font-size="10" fill="#555">'S' on one TCP connection</text>

<rect x="720" y="490" width="300" height="250" rx="12" fill="#fff" stroke="#7650b5" stroke-width="2"/>
<text x="870" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#5b3591">3 · APPLY</text>
<rect x="740" y="545" width="260" height="65" rx="8" fill="#f8f4fc" stroke="#b99bd5"/>
<text x="870" y="570" text-anchor="middle" font-size="11.5" font-weight="700">Replay response</text>
<text x="870" y="589" text-anchor="middle" font-size="10" fill="#555">contiguous frames from resume seq</text>
<rect x="740" y="625" width="260" height="65" rx="8" fill="#f8f4fc" stroke="#b99bd5"/>
<text x="870" y="650" text-anchor="middle" font-size="11.5" font-weight="700">Snapshot response</text>
<text x="870" y="669" text-anchor="middle" font-size="10" fill="#555">START → CLEAR → AddOrder → END</text>

<rect x="1065" y="490" width="365" height="250" rx="12" fill="#fff" stroke="#7650b5" stroke-width="2"/>
<text x="1247" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#5b3591">4 · MERGE &amp; RESUME</text>
<text x="1247" y="558" text-anchor="middle" font-size="11" fill="#555">Incrementals arriving during recovery</text>
<text x="1247" y="578" text-anchor="middle" font-size="11" font-weight="700">are queued — never dropped.</text>
<text x="1247" y="610" text-anchor="middle" font-size="10.5" fill="#555">Apply recovered state first</text>
<text x="1247" y="630" text-anchor="middle" font-size="10.5" fill="#555">Drop queued seq ≤ resume point</text>
<text x="1247" y="650" text-anchor="middle" font-size="10.5" fill="#555">Apply remaining increments in order</text>
<text x="1247" y="680" text-anchor="middle" font-size="11" font-weight="700" fill="#5b3591">market_data_synchronized = true</text>
<text x="1247" y="702" text-anchor="middle" font-size="10.5" fill="#555">push merged updates → md_queue</text>

<line x1="330" y1="615" x2="367" y2="615" stroke="#7650b5" stroke-width="3" marker-end="url(#purple2)"/>
<line x1="675" y1="615" x2="712" y2="615" stroke="#7650b5" stroke-width="3" marker-end="url(#purple2)"/>
<line x1="1020" y1="615" x2="1057" y2="615" stroke="#7650b5" stroke-width="3" marker-end="url(#purple2)"/>

<!-- clean API feedback line, outside boxes -->
<path d="M525 740 V775 H1247 V740" fill="none" stroke="#7650b5" stroke-width="2.5" marker-end="url(#purple2)"/>
<text x="885" y="770" text-anchor="middle" font-size="10" fill="#7650b5">TCP status / recovered frames</text>

<!-- merge back to live queue: one vertical-ish path at far right -->
<path d="M1247 490 V405 H1352 V350" fill="none" stroke="#1769aa" stroke-width="2.8" stroke-dasharray="7 5" marker-end="url(#blue2)"/>
<text x="1270" y="395" font-size="10" fill="#1769aa">resume → md_queue</text>

<!-- API details -->
<rect x="70" y="760" width="1360" height="35" rx="7" fill="#fff" stroke="#cfc4df"/>
<text x="750" y="783" text-anchor="middle" font-size="10.5" fill="#555">
Status: 'R' granted · 'N' denied → snapshot · 'C' already current · truncated/out-of-order replay → abort and retry
</text>
</svg>